<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Sample journal cover</title>
  <desc id="desc">An abstract editorial illustration of notebook lines, a bracket, and a large quotation mark.</desc>
  <defs>
    <pattern id="paper-lines" width="1200" height="38" patternUnits="userSpaceOnUse">
      <line x1="0" y1="37" x2="1200" y2="37" stroke="#173f3b" stroke-width="1" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#f2eadc" />
  <rect width="1200" height="600" fill="url(#paper-lines)" />

  <line x1="92" y1="76" x2="92" y2="524" stroke="#a65f32" stroke-width="2" opacity="0.6" />
  <text x="128" y="100" fill="#6f685b" font-family="Inter, Segoe UI, sans-serif" font-size="14" letter-spacing="4.5">JOURNAL / SAMPLE</text>

  <text x="108" y="430" fill="#a65f32" font-family="Georgia, 'Times New Roman', serif" font-size="360" opacity="0.22">“</text>

  <g fill="none" stroke="#173f3b" stroke-width="2" opacity="0.55">
    <path d="M760 180H720V420H760" />
    <path d="M1080 180H1120V420H1080" />
  </g>
  <g stroke="#173f3b" stroke-width="3" opacity="0.72" stroke-linecap="round">
    <path d="M800 250H1040" />
    <path d="M800 294H1010" />
    <path d="M800 338H1052" />
    <path d="M800 382H930" />
  </g>
  <circle cx="968" cy="470" r="34" fill="#173f3b" opacity="0.9" />
  <path d="M952 470L964 482L986 458" fill="none" stroke="#f2eadc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <text x="128" y="520" fill="#6f685b" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="2.4">NOTES · METHODS · QUESTIONS</text>
</svg>
